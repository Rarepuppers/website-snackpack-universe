name: Refresh hub visual baselines

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/refresh-hub-snapshots.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Regenerate hub snapshots on the gate platform
        run: npx playwright test tests/visual/arcade.spec.mjs --grep "hub" --update-snapshots
      - name: Commit authoritative Linux baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/visual/__screenshots__/hub-*.png
          git diff --cached --quiet && exit 0
          git commit -m "Refresh hub snapshots on Linux"
          git push
