name: Check website

on:
  pull_request:
    paths:
      - "**/*.html"
      - "**/*.css"
      - "**/*.js"
      - "**/*.mjs"
      - "**/*.json"
      - "**/*.xml"
      - "assets/**"
      - "play/**"
      - ".github/workflows/site-check.yml"
  push:
    branches: [main]
    paths:
      - "**/*.html"
      - "**/*.css"
      - "**/*.js"
      - "**/*.mjs"
      - "**/*.json"
      - "**/*.xml"
      - "assets/**"
      - "play/**"
      - ".github/workflows/site-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check JavaScript syntax
        run: node scripts/check-javascript.mjs

      - name: Check website delivery contract
        run: node scripts/check-website-delivery.mjs

      - name: Check site integrity
        run: node scripts/check-site.mjs

      # Catches the drift that hit three times in a week: a volume gains a game
      # in the companion monorepo and the ~30 places the site states a count go
      # stale. The companion repo is not checked out here, so this validates the
      # markup against data/game-counts.json only; the monorepo cross-check runs
      # locally, where the app source actually exists.
      - name: Check game counts
        run: node scripts/build-game-counts.mjs --check

      # Every outbound Play link must carry a referrer, or the install it drives
      # is filed as organic Play search and the web funnel goes dark. 136 of 137
      # links were untagged until 2026-08-15; this is what stops that returning.
      - name: Check Play link attribution
        run: node scripts/build-play-links.mjs --check

      # A new app page ships with a direct Play badge and its download clicks
      # are invisible again. Cheap to regenerate, silent to lose, so assert it.
      - name: Check download-click interstitials
        run: node scripts/build-go-links.mjs --check

      # The app pages are where referral traffic lands and they had no email
      # capture at all. A new app page shipping without it loses those readers
      # silently, so assert the block is present and current.
      - name: Check newsletter CTA
        run: node scripts/build-newsletter-cta.mjs --check

      # Catches a rule that pins a background but lets its text follow the theme:
      # fine in cream, invisible in dark. This is how the hero and the primary
      # button shipped unreadable.
      - name: Check theme contrast
        run: node scripts/check-contrast.mjs
