name: Check website

on:
  pull_request:
    paths:
      - "**/*.html"
      - "**/*.css"
      - "**/*.js"
      - "**/*.mjs"
      - "**/*.json"
      - "**/*.xml"
      - "assets/**"
      - "play/**"
      - ".github/workflows/site-check.yml"
  push:
    branches: [main]
    paths:
      - "**/*.html"
      - "**/*.css"
      - "**/*.js"
      - "**/*.mjs"
      - "**/*.json"
      - "**/*.xml"
      - "assets/**"
      - "play/**"
      - ".github/workflows/site-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check JavaScript syntax
        run: node scripts/check-javascript.mjs

      - name: Enforce new arcade game quality bar
        run: node scripts/check-new-game.mjs

      - name: Check website delivery contract
        run: node scripts/check-website-delivery.mjs

      - name: Check site integrity
        run: node scripts/check-site.mjs

      # Catches the drift that hit three times in a week: a volume gains a game
      # in the companion monorepo and the ~30 places the site states a count go
      # stale. The companion repo is not checked out here, so this validates the
      # markup against data/game-counts.json only; the monorepo cross-check runs
      # locally, where the app source actually exists.
      - name: Check game counts
        run: node scripts/build-game-counts.mjs --check

      - name: Check arcade ItemList schema
        run: node scripts/build-arcade-schema.mjs --check

      # Every outbound Play link must carry a referrer, or the install it drives
      # is filed as organic Play search and the web funnel goes dark. 136 of 137
      # links were untagged until 2026-08-15; this is what stops that returning.
      - name: Check Play link attribution
        run: node scripts/build-play-links.mjs --check

      # A new app page ships with a direct Play badge and its download clicks
      # are invisible again. Cheap to regenerate, silent to lose, so assert it.
      - name: Check download-click interstitials
        run: node scripts/build-go-links.mjs --check

      # The app pages are where referral traffic lands and they had no email
      # capture at all. A new app page shipping without it loses those readers
      # silently, so assert the block is present and current.
      - name: Check newsletter CTA
        run: node scripts/build-newsletter-cta.mjs --check

      # Catches a rule that pins a background but lets its text follow the theme:
      # fine in cream, invisible in dark. This is how the hero and the primary
      # button shipped unreadable.
      - name: Check theme contrast
        run: node scripts/check-contrast.mjs

  last-bastion:
    # The game's 1,626 unit tests, its typechecker and its content/combat audits
    # ran only on one developer's machine until 11 September 2026: the sole
    # Last Bastion step in CI was the five-scenario browser lane below. The
    # deepest test suite on the site was not defending the branch.
    #
    # `build:check` is what stops the browser lane passing against a stale
    # bundle: the published chunks are committed, so a source change without a
    # rebuild would otherwise leave every browser check green on yesterday's game.
    #
    # The PowerShell `smoke` and `offline` lanes stay local until they are
    # ported off `powershell`; they check the published tree, which build:check
    # now proves is current.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            play/last-bastion/dev/package-lock.json
            play/last-bastion/desktop/package-lock.json
      - name: Install game dependencies
        run: npm ci
        working-directory: play/last-bastion/dev
      - name: Typecheck the game
        run: npm run typecheck
        working-directory: play/last-bastion/dev
      - name: Run the game test suite
        run: npm test
        working-directory: play/last-bastion/dev
      - name: Audit content inventory
        run: npm run content:audit
        working-directory: play/last-bastion/dev
      - name: Audit combat adapter boundaries
        run: npm run combat:audit:boundaries
        working-directory: play/last-bastion/dev
      - name: Check the published bundle matches source
        run: npm run build:check
        working-directory: play/last-bastion/dev
      - name: Install desktop host dependencies
        # The desktop tests are pure Node: none of them import `electron`, and
        # none launch a window. Skipping the ~100 MB binary download keeps this
        # job fast and stops an unrelated CDN hiccup reddening the branch.
        # Packaged-window acceptance is a manual hardware gate, not this job.
        run: npm ci
        working-directory: play/last-bastion/desktop
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - name: Build and test the desktop host
        run: npm test
        working-directory: play/last-bastion/desktop

  visual-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install test dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Compare arcade screenshots
        run: npm run test:visual
      - name: Exercise Last Bastion browser journeys
        run: npx playwright test --config playwright.last-bastion.config.mjs
      - name: Upload visual diff on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: arcade-visual-diff
          path: |
            test-results/
            playwright-report/
