<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <link rel="icon" href="data:,">
  <title>Snack Drop Asset Gallery</title>
  <style>
    :root { color-scheme: light; color: #3a2414; background: #fff6e9; font: 16px system-ui, sans-serif; }
    body { margin: 0 auto; padding: 14px; box-sizing: border-box; max-width: 1420px; }
    header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 20px; margin-bottom: 12px; }
    h1 { margin: 0; font-size: clamp(22px, 4vw, 28px); line-height: 1.2; }
    nav { display: flex; gap: 5px; }
    nav a { color: inherit; min-height: 36px; display: grid; place-items: center; padding: 0 10px; border-radius: 7px; }
    nav a[aria-current] { background: #f0d9bb; font-weight: 650; }
    #gallery { display: grid; gap: 10px; }
    #gallery.containers { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    figure { position: relative; min-width: 0; margin: 0; border: 1px solid #dfc0a0; border-radius: 12px; overflow: hidden; background: #f3dfc4; }
    figcaption { position: absolute; top: 9px; left: 10px; z-index: 1; border-radius: 5px; background: #fff8ea; padding: 3px 6px; font-size: 13px; font-weight: 650; }
    .view { position: relative; height: clamp(420px, calc(100dvh - 105px), 710px); }
    .containers .view { height: clamp(220px, 48vw, 510px); }
    canvas { display: block; width: 100%; height: 100%; }
    .tier-label { position: absolute; transform: translate(-50%, -50%); white-space: nowrap; pointer-events: none; background: #fff8eb; color: #3a2414; border-radius: 4px; padding: 1px 3px; font-size: clamp(8px, 2vw, 12px); font-weight: 700; }
    #status { margin: 8px 0 0; font-size: 13px; }
    @media (max-width: 700px) { #gallery.containers { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  </style>
  <script src="../vendor/planck-1.5.1.min.js"></script>
  <script src="../engine.js"></script>
  <script type="module" src="./gallery.js"></script>
</head>
<body>
  <header>
    <h1>Snack Drop Asset Gallery</h1>
    <nav aria-label="Gallery view">
      <a href="?view=snacks">Snacks</a>
      <a href="?view=containers">Containers</a>
      <a href="?view=cameos">Cameos</a>
    </nav>
  </header>
  <main id="gallery" aria-label="Asset previews"></main>
  <p id="status" role="status">Loading models…</p>
</body>
</html>
