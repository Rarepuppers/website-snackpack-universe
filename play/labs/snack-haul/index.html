<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Snack Haul</title>
<!-- PLAYTEST BUILD: unlisted on purpose. Not in the hub, sitemap or service worker. -->
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Snack Haul is a cargo truck physics game playtest from SnackPack Studios.">
<meta name="theme-color" content="#7a4a2a">
<link rel="canonical" href="https://www.snackpackuniverse.com/play/labs/snack-haul/">
<link rel="icon" type="image/png" href="/assets/favicon-32.png">
<link rel="stylesheet" href="/assets/fonts/fonts.css">
<style>
  :root {
    --bg: #2b1d14; --panel: #3b2a1e; --panel-2: #4e3827; --line: #ffffff22;
    --ink: #fff6e8; --soft: #d9c6ae; --sun: #f7b73d; --go: #5ec48a; --bad: #ee6b5f;
    --serif: "Fraunces", Georgia, serif; --sans: "DM Sans", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: var(--sans); -webkit-tap-highlight-color: transparent; }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:disabled { cursor: default; }
  button:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }
  h1, h2, h3 { font-family: var(--serif); margin: 0; }
  .btn { background: var(--panel-2); border: 1px solid var(--line); border-radius: 12px; padding: 12px 18px; font-weight: 700; min-height: 46px; }
  .btn.primary { background: var(--sun); color: #33210a; border-color: transparent; }
  .btn:disabled { opacity: .45; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }

  /* Menus */
  #menu { max-width: 880px; margin: 0 auto; padding: 10px 16px 32px; }
  .top { display: flex; justify-content: space-between; align-items: center; min-height: 36px; }
  .top a, .link { color: var(--soft); font-size: .85rem; text-decoration: none; background: none; border: 0; padding: 6px 4px; }
  .hero { text-align: center; padding: 10px 0 8px; }
  .hero h1 { font-size: clamp(2.5rem, 10vw, 3.8rem); line-height: 1.02; }
  .hero p { color: var(--soft); margin: 8px auto 0; max-width: 32rem; line-height: 1.45; }
  .purse { display: flex; justify-content: center; gap: 16px; font-weight: 800; margin: 10px 0 2px; }
  .section { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 14px; margin-top: 12px; }
  .section h2 { font-size: 1.15rem; }
  .sub { color: var(--soft); font-size: .84rem; margin: 2px 0 8px; }
  .routes { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 8px; }
  .route { background: var(--panel-2); border: 1px solid var(--line); border-radius: 12px; padding: 9px 4px; min-height: 66px; text-align: center; }
  .route b { display: block; } .route small { color: var(--sun); letter-spacing: 1px; }
  .route:disabled { opacity: .4; }
  .ups { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 8px; }
  .up { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; align-items: center; background: var(--panel-2); border-radius: 12px; padding: 10px; }
  .up small { color: var(--soft); line-height: 1.3; grid-column: 1; }
  .up .pips { color: var(--sun); letter-spacing: 2px; font-size: .78rem; grid-column: 1; }
  .up button { grid-row: 1 / span 3; grid-column: 2; }
  .note { color: var(--soft); font-size: .84rem; text-align: center; margin: 12px 0 0; }

  /* Driving */
  #stage { position: fixed; inset: 0; display: none; background: #000; touch-action: none; user-select: none; -webkit-user-select: none; overflow: hidden; }
  #game { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .hud {
    position: absolute; top: max(8px, env(safe-area-inset-top)); left: 10px; right: 10px;
    display: flex; gap: 8px; align-items: center; font-weight: 800; pointer-events: none;
    color: #2d1b0c; text-shadow: 0 1px 0 #ffffff66;
  }
  .chip { background: #fff8ebe0; border-radius: 10px; padding: 5px 9px; font-size: .9rem; white-space: nowrap; color: #2d1b0c; text-shadow: none; }
  .fuel { flex: 1; max-width: 240px; height: 16px; background: #fff8ebe0; border-radius: 8px; overflow: hidden; padding: 2px; }
  .fuel i { display: block; height: 100%; background: var(--go); border-radius: 6px; }
  .fuel i.low { background: var(--bad); }
  .pause { pointer-events: auto; margin-left: auto; background: #fff8ebe0; color: #2d1b0c; border: 0; border-radius: 10px; min-width: 44px; min-height: 40px; font-weight: 800; }
  .progress { position: absolute; top: max(58px, calc(env(safe-area-inset-top) + 50px)); left: 12px; right: 12px; height: 6px; background: #00000030; border-radius: 3px; pointer-events: none; }
  .progress i { display: block; height: 100%; width: 0; background: #fff; border-radius: 3px; }
  .toast { position: absolute; top: 26%; left: 50%; transform: translateX(-50%); font-family: var(--serif); font-weight: 800; font-size: 1.5rem; color: #fff; text-shadow: 0 2px 6px #000b; pointer-events: none; opacity: 0; transition: opacity .2s; text-align: center; white-space: nowrap; }
  .toast.on { opacity: 1; }
  .pedal {
    position: absolute; bottom: max(14px, env(safe-area-inset-bottom)); width: min(34vw, 150px); height: min(26vh, 130px);
    min-height: 92px; border-radius: 22px; border: 3px solid #ffffff99; background: #00000040; color: #fff;
    font-weight: 800; font-size: 1.05rem; touch-action: none; text-shadow: 0 1px 3px #000;
  }
  .pedal.on { background: #ffffff66; }
  #brake { left: max(14px, env(safe-area-inset-left)); }
  #gas { right: max(14px, env(safe-area-inset-right)); }

  .veil { position: absolute; inset: 0; background: #1a0f08c7; display: none; place-items: center; padding: 16px; overflow-y: auto; z-index: 10; }
  .veil.on { display: grid; }
  .sheet { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 20px; width: min(420px, 100%); text-align: center; }
  .sheet h2 { font-size: 1.6rem; }
  .sheet p { color: var(--soft); line-height: 1.45; margin: 8px 0; }
  .stars { color: var(--sun); font-size: 2rem; letter-spacing: 4px; min-height: 2.4rem; }
  .lines { list-style: none; padding: 0; margin: 10px 0; text-align: left; }
  .lines li { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid var(--line); }
  .lines li.total { font-weight: 800; color: var(--sun); border: 0; }
</style>
</head>
<body>
<div id="menu"></div>
<div id="stage">
  <canvas id="game"></canvas>
  <div class="hud">
    <span class="chip" id="load" aria-label="Cargo still on the truck">📦 0</span>
    <span class="chip" id="coins">🪙 0</span>
    <span class="fuel" aria-label="Fuel"><i id="fuel"></i></span>
    <button class="pause" id="pause" aria-label="Pause">II</button>
  </div>
  <div class="progress" aria-hidden="true"><i id="prog"></i></div>
  <div class="toast" id="toast" role="status"></div>
  <button class="pedal" id="brake" aria-label="Brake and reverse">BRAKE</button>
  <button class="pedal" id="gas" aria-label="Accelerate">GAS</button>
  <div class="veil" id="veil"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
</div>
<script src="vendor/planck-1.5.1.min.js"></script>
<script src="engine.js"></script>
<script>
(function () {
  var SH = window.SnackHaul, KEY = "sp_snackhaul_v1";
  var menu = document.getElementById("menu"), stage = document.getElementById("stage");
  var canvas = document.getElementById("game"), ctx = canvas.getContext("2d");
  var veil = document.getElementById("veil"), sheet = document.getElementById("sheet"), toastEl = document.getElementById("toast");
  var el = { load: document.getElementById("load"), coins: document.getElementById("coins"), fuel: document.getElementById("fuel"), prog: document.getElementById("prog"), gas: document.getElementById("gas"), brake: document.getElementById("brake") };

  function load() { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } }
  var save = Object.assign({ coins: 0, stars: {}, upgrades: {}, runs: 0, days: [], sound: true }, load());
  function persist() { try { localStorage.setItem(KEY, JSON.stringify(save)); } catch (e) { /* plays on without storage */ } }
  function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;"); }

  // ════ Sound: engine note, thuds and coins from a small synth ═════
  var audio = null, engineOsc = null, engineGain = null;
  function ensureAudio() {
    if (!save.sound || audio) return;
    try {
      audio = new (window.AudioContext || window.webkitAudioContext)();
      engineOsc = audio.createOscillator(); engineGain = audio.createGain();
      engineOsc.type = "sawtooth"; engineOsc.frequency.value = 60; engineGain.gain.value = 0;
      var filter = audio.createBiquadFilter(); filter.type = "lowpass"; filter.frequency.value = 420;
      engineOsc.connect(filter); filter.connect(engineGain); engineGain.connect(audio.destination); engineOsc.start();
    } catch (e) { audio = null; }
  }
  function beep(freq, dur, type, vol) {
    if (!save.sound || !audio) return;
    var o = audio.createOscillator(), g = audio.createGain(), t = audio.currentTime;
    o.type = type || "triangle"; o.frequency.value = freq;
    g.gain.setValueAtTime(vol || 0.07, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(audio.destination); o.start(t); o.stop(t + dur);
  }
  function engineNote(speed, on) {
    if (!engineGain) return;
    var t = audio.currentTime;
    engineOsc.frequency.setTargetAtTime(52 + Math.abs(speed) * 11 + (on ? 18 : 0), t, 0.06);
    engineGain.gain.setTargetAtTime(!view.running || !save.sound ? 0 : on ? 0.055 : 0.02, t, 0.05);
  }

  // ════ Menus ══════════════════════════════════════════════════════
  function levelOf(id) { return save.upgrades[id] || 0; }
  function renderMenu() {
    var regions = SH.REGIONS.map(function (region, r) {
      var cells = SH.DELIVERIES.filter(function (d) { return d.region === r; }).map(function (d) {
        var open = SH.isOpen(d.id, save.stars), st = save.stars[d.id] || 0;
        return '<button class="route" data-go="' + d.id + '"' + (open ? "" : " disabled") + ' aria-label="' + esc(region.name) + " delivery " + (d.index + 1) + ", " + st + ' stars"><b>' + (d.index + 1) + "</b><small>" + "★".repeat(st) + "☆".repeat(3 - st) + "</small></button>";
      }).join("");
      return '<div class="section"><h2>' + esc(region.name) + '</h2><p class="sub">' + esc(["Gentle hills and good grip.", "Long dunes and loose sand.", "Steep ice. Brake early."][r]) + '</p><div class="routes">' + cells + "</div></div>";
    }).join("");
    var ups = SH.UPGRADES.map(function (u) {
      var lv = levelOf(u.id), cost = SH.upgradeCost(lv);
      return '<div class="up"><b>' + u.icon + " " + esc(u.name) + '</b><span class="pips">' + "●".repeat(lv) + "○".repeat(SH.MAX_LEVEL - lv) + "</span><small>" + esc(u.desc) + "</small>" +
        (cost == null ? '<button class="btn" disabled>Max</button>' : '<button class="btn" data-up="' + u.id + '"' + (save.coins < cost ? " disabled" : "") + ">🪙 " + cost + "</button>") + "</div>";
    }).join("");
    var total = Object.keys(save.stars).reduce(function (n, k) { return n + save.stars[k]; }, 0);
    menu.innerHTML = '<div class="top"><a href="../../">← Arcade</a><button class="link" data-sound>Sound ' + (save.sound ? "on" : "off") + "</button></div>" +
      '<section class="hero"><h1>Snack Haul</h1><p>Get the load there in one piece. Drive too fast and your cargo goes flying. Too slow, and you run out of fuel.</p></section>' +
      '<div class="purse"><span>🪙 ' + save.coins + "</span><span>★ " + total + "/" + SH.DELIVERIES.length * 3 + "</span></div>" + regions +
      '<div class="section"><h2>Garage</h2><p class="sub">Spend what you earn. Straps and suspension save your cargo.</p><div class="ups">' + ups + "</div></div>" +
      '<div class="section"><h2>How to drive</h2><p class="sub" style="margin:6px 0 0;line-height:1.5">Hold GAS and BRAKE at the bottom of the screen, or use the arrow keys. In the air, GAS tips the nose up and BRAKE tips it down. Stop in the marked zone at the depot to unload. Eggs crack on hard landings.</p></div>' +
      '<p class="note">Playtest build: everything is free and your progress stays on this device. Turn your phone sideways for the best view.</p>';
  }
  menu.addEventListener("click", function (e) {
    var go = e.target.closest("[data-go]"), up = e.target.closest("[data-up]"), snd = e.target.closest("[data-sound]");
    if (go && !go.disabled) startDelivery(go.getAttribute("data-go"));
    if (up && !up.disabled) {
      var id = up.getAttribute("data-up"), cost = SH.upgradeCost(levelOf(id));
      if (cost != null && save.coins >= cost) { save.coins -= cost; save.upgrades[id] = levelOf(id) + 1; persist(); renderMenu(); }
    }
    if (snd) { save.sound = !save.sound; persist(); renderMenu(); }
  });

  // ════ Delivery loop ══════════════════════════════════════════════
  var view = { game: null, running: false, last: 0, acc: 0, camX: 0, camY: 0, input: { gas: false, brake: false }, toastUntil: 0 };

  function startDelivery(id) {
    ensureAudio();
    if (audio && audio.state === "suspended") audio.resume();
    var game = SH.createGame({ id: id, upgrades: save.upgrades });
    view.game = game; view.id = id; view.acc = 0;
    var p = game.truck.getPosition();
    view.camX = p.x; view.camY = p.y;
    view.input.gas = view.input.brake = false;
    syncPedals();
    menu.style.display = "none"; stage.style.display = "block";
    veil.classList.remove("on");
    resize();
    save.runs += 1;
    var d = new Date().toISOString().slice(0, 10);
    if (save.days.indexOf(d) < 0) save.days = save.days.concat(d).slice(-60);
    persist();
    toast(game.region.name + " " + (game.delivery.index + 1) + ": " + game.cargo.length + " to deliver", 1800);
    view.running = true; view.last = performance.now();
    requestAnimationFrame(loop);
  }
  function toast(text, ms) {
    toastEl.textContent = text; toastEl.classList.add("on");
    view.toastUntil = performance.now() + (ms || 1200);
  }
  function drainEvents(g) {
    g.events.splice(0).forEach(function (ev) {
      if (ev.type === "coin") beep(1180, 0.08, "triangle", 0.05);
      else if (ev.type === "fuel") { beep(520, 0.2, "sine", 0.08); toast("Fuel!", 700); }
      else if (ev.type === "lost") { beep(140, 0.2, "square", 0.05); toast("Cargo lost!", 800); }
      else if (ev.type === "broken") { beep(900, 0.12, "sawtooth", 0.05); toast("Eggs cracked!", 800); }
    });
  }
  function loop(now) {
    if (!view.running) return;
    var g = view.game, dt = Math.min(0.1, (now - view.last) / 1000);
    view.last = now; view.acc += dt;
    while (view.acc >= SH.STEP) { g.step(view.input); view.acc -= SH.STEP; }
    drainEvents(g);
    if (now > view.toastUntil) toastEl.classList.remove("on");
    engineNote(g.speed(), view.input.gas);
    draw(g);
    hud(g);
    if (g.status !== "driving") { view.running = false; engineNote(0, false); setTimeout(function () { showResult(g); }, 900); return; }
    requestAnimationFrame(loop);
  }
  function hud(g) {
    el.load.textContent = "📦 " + g.live() + "/" + g.cargo.length;
    el.coins.textContent = "🪙 " + g.coinsTaken;
    var f = g.fuel / g.maxFuel;
    el.fuel.style.width = (f * 100).toFixed(1) + "%";
    el.fuel.className = f < 0.25 ? "low" : "";
    el.prog.style.width = Math.min(100, (g.truck.getPosition().x / g.terrain.zoneStart) * 100).toFixed(1) + "%";
  }

  function showResult(g) {
    var r = SH.report(g), best = save.stars[view.id] || 0;
    save.coins += r.earned;
    if (r.stars > best) save.stars[view.id] = r.stars;
    persist();
    var why = { load: "Too much of the load is gone. You need " + g.need + " of " + r.total + " to make the delivery.", flip: "The truck is on its roof.", fuel: "You ran out of fuel." }[r.reason] || "";
    var list = r.lines.map(function (l) { return "<li><span>" + esc(l.label) + "</span><b>+" + l.coins + "</b></li>"; }).join("");
    var next = nextDelivery();
    sheet.innerHTML = "<h2>" + (r.status === "done" ? "Delivered!" : "Delivery failed") + "</h2>" +
      '<div class="stars" aria-label="' + r.stars + ' stars">' + "★".repeat(r.stars) + "☆".repeat(3 - r.stars) + "</div>" +
      (why ? "<p>" + esc(why) + "</p>" : "") +
      (list ? '<ul class="lines">' + list + '<li class="total"><span>Earned</span><span>🪙 ' + r.earned + "</span></li></ul>" : "") +
      '<div class="row">' + (r.status === "done" && next ? '<button class="btn primary" data-act="next">Next delivery</button>' : "") +
      '<button class="btn' + (r.status === "done" && next ? "" : " primary") + '" data-act="retry">Try again</button>' +
      '<button class="btn" data-act="menu">Garage</button></div>';
    veil.classList.add("on");
    beep(r.status === "done" ? 784 : 196, 0.3, "triangle", 0.08);
  }
  function nextDelivery() {
    var i = SH.DELIVERIES.map(function (d) { return d.id; }).indexOf(view.id), n = SH.DELIVERIES[i + 1];
    return n && SH.isOpen(n.id, save.stars) ? n.id : null;
  }
  function exitToMenu() {
    view.running = false; engineNote(0, false);
    stage.style.display = "none"; menu.style.display = "block";
    veil.classList.remove("on");
    renderMenu();
  }
  function pause() {
    if (!view.running) return;
    view.running = false; engineNote(0, false);
    sheet.innerHTML = '<h2>Paused</h2><div class="row" style="margin-top:12px"><button class="btn primary" data-act="resume">Keep driving</button><button class="btn" data-act="retry">Restart</button><button class="btn" data-act="menu">Garage</button></div>';
    veil.classList.add("on");
  }
  sheet.addEventListener("click", function (e) {
    var b = e.target.closest("[data-act]");
    if (!b) return;
    var a = b.getAttribute("data-act");
    if (a === "menu") exitToMenu();
    if (a === "retry") startDelivery(view.id);
    if (a === "next") startDelivery(nextDelivery());
    if (a === "resume") { veil.classList.remove("on"); view.running = true; view.last = performance.now(); requestAnimationFrame(loop); }
  });
  document.getElementById("pause").addEventListener("click", pause);
  document.addEventListener("visibilitychange", function () { if (document.hidden) pause(); });

  // ════ Controls: each pedal tracks its own pointers, so both work at once ═
  function syncPedals() {
    el.gas.classList.toggle("on", view.input.gas);
    el.brake.classList.toggle("on", view.input.brake);
  }
  function bindPedal(button, name) {
    var held = {};
    function update() { view.input[name] = Object.keys(held).length > 0; syncPedals(); }
    button.addEventListener("pointerdown", function (e) {
      e.preventDefault(); held[e.pointerId] = true;
      try { button.setPointerCapture(e.pointerId); } catch (x) { /* synthetic pointer */ }
      if (audio && audio.state === "suspended") audio.resume();
      update();
    });
    ["pointerup", "pointercancel", "lostpointercapture"].forEach(function (type) {
      button.addEventListener(type, function (e) { delete held[e.pointerId]; update(); });
    });
    button.addEventListener("contextmenu", function (e) { e.preventDefault(); });
  }
  bindPedal(el.gas, "gas"); bindPedal(el.brake, "brake");
  var keyMap = { ArrowRight: "gas", KeyD: "gas", ArrowLeft: "brake", KeyA: "brake" };
  window.addEventListener("keydown", function (e) {
    if (keyMap[e.code] && stage.style.display === "block") { view.input[keyMap[e.code]] = true; syncPedals(); e.preventDefault(); }
    if (e.code === "Escape") pause();
  });
  window.addEventListener("keyup", function (e) {
    if (keyMap[e.code]) { view.input[keyMap[e.code]] = false; syncPedals(); }
  });

  // ════ Drawing ════════════════════════════════════════════════════
  var W = 0, H = 0, DPR = 1, scale = 40;
  function resize() {
    DPR = Math.min(2, window.devicePixelRatio || 1);
    W = stage.clientWidth || window.innerWidth; H = stage.clientHeight || window.innerHeight;
    canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
    // Show about 22 m across in landscape, and never less than 13 m on a tall phone.
    scale = Math.min(W / 13, Math.max(W / 24, H / 15));
    if (view.game) draw(view.game);
  }
  window.addEventListener("resize", resize);

  function sx(x) { return (x - view.camX) * scale + W * 0.36; }
  function sy(y) { return H * 0.6 - (y - view.camY) * scale; }

  function roundBox(x, y, w, h, r, fill, stroke) {
    ctx.beginPath(); ctx.roundRect(x, y, w, h, r); ctx.fillStyle = fill; ctx.fill();
    if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = 0.04; ctx.stroke(); }
  }
  // Painted in metres inside a body's own space, y pointing up.
  function inBody(body, paint) {
    var p = body.getPosition();
    ctx.save(); ctx.translate(sx(p.x), sy(p.y)); ctx.scale(scale, -scale); ctx.rotate(body.getAngle());
    paint(); ctx.restore();
  }
  function parallax(color, factor, height, wave) {
    ctx.beginPath(); ctx.moveTo(0, H);
    for (var x = 0; x <= W + 24; x += 24) {
      var wx = x / scale + view.camX * factor;
      var y = H * height + Math.sin(wx / wave) * 34 + Math.sin(wx / (wave * 0.37) + 1.3) * 14;
      ctx.lineTo(x, y);
    }
    ctx.lineTo(W, H); ctx.closePath(); ctx.fillStyle = color; ctx.fill();
  }
  var CARGO_ART = { crate: ["#d9a15c", "#8a5a2c"], eggs: ["#fff4d6", "#c9a35c"], jelly: ["#ff7ea8", "#b83a6a"], milk: ["#e8f3ff", "#5c86b8"] };

  function draw(g) {
    var region = g.region, t = g.terrain, pos = g.truck.getPosition(), vel = g.truck.getLinearVelocity();
    view.camX += (pos.x + vel.x * 0.35 - view.camX) * 0.09;
    view.camY += (pos.y - view.camY) * 0.09;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    var sky = ctx.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, region.sky[0]); sky.addColorStop(1, region.sky[1]);
    ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);
    parallax(region.far, 0.2, 0.42, 9);
