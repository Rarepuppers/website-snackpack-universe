<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Snack Haul</title>
<!-- PLAYTEST BUILD: unlisted on purpose. Not in the hub, sitemap or service worker. -->
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Snack Haul is a 3D cargo truck physics game playtest from SnackPack Studios.">
<meta name="theme-color" content="#2b1d14">
<link rel="canonical" href="https://www.snackpackuniverse.com/play/labs/snack-haul/">
<link rel="icon" type="image/png" href="/assets/favicon-32.png">
<link rel="stylesheet" href="/assets/fonts/fonts.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="view" aria-label="Snack Haul game view"></canvas>

<div id="drive" hidden>
  <div class="hud">
    <span class="chip" id="load" aria-label="Cargo still on the truck">📦 0</span>
    <span class="chip" id="coins">🪙 0</span>
    <span class="chip" id="clock">0s</span>
    <span class="fuel" aria-label="Fuel"><i id="fuel"></i></span>
    <button class="pause" id="pause" aria-label="Pause">II</button>
  </div>
  <div class="progress" aria-hidden="true"><i id="prog"></i></div>
  <div class="toast" id="toast" role="status"></div>
  <div class="hint" id="hint" role="status"></div>
  <div class="stop" id="stop" hidden><span>Stop to unload</span><i id="stopbar"></i></div>
  <button class="pedal" id="brake" aria-label="Brake and reverse"><b>BRAKE</b></button>
  <button class="pedal" id="gas" aria-label="Accelerate"><b>GAS</b></button>
</div>

<div id="ui"></div>
<div class="veil" id="veil"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>

<script src="vendor/planck-1.5.1.min.js"></script>
<script src="engine.js"></script>
<script type="module" src="app.js"></script>
<script defer src="https://static.cloudflareinsights.com/beacon.min.js"
        data-cf-beacon='{"token": "0e57cfb3eb86422ca40e5fac02b1cf94"}'></script>
</body>
</html>
