# Friend rooms for the SnackPack arcade. Deploy with `npx wrangler@4 deploy` from
# this folder, then follow the go-live steps in README.md.
name = "snackpack-arcade-rooms"
main = "src/worker.js"
compatibility_date = "2025-06-01"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
