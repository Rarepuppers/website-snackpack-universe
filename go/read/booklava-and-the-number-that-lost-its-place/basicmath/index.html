<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Opening Google Play — SnackPack Basic Math</title>
<link rel="icon" type="image/png" href="/assets/favicon-32.png">
<style>
  body { font-family: system-ui, sans-serif; margin: 0; min-height: 100vh;
         display: flex; align-items: center; justify-content: center;
         text-align: center; padding: 24px; }
</style>
</head>
<body>
<main>
  <p>Taking you to Google Play…</p>
  <!-- Single source of truth for the URL: the redirect below reads this
       anchor, so build-play-links.mjs tagging it tags the redirect too. It is
       also the no-JavaScript path -- without it this page is a dead end. -->
  <p><a id="go-link" href="https://play.google.com/store/apps/details?id=com.snackpackuniverse.basicmath&referrer=utm_source%3Dwebsite%26utm_medium%3Dread%26utm_campaign%3Dbooklava-and-the-number-that-lost-its-place" rel="noopener">Continue to SnackPack Basic Math on Google Play</a></p>
  <p><a href="/read/booklava-and-the-number-that-lost-its-place/">Go back</a></p>
</main>
<!-- Cloudflare Web Analytics -->
<script defer src="https://static.cloudflareinsights.com/beacon.min.js"
        data-cf-beacon='{"token": "0e57cfb3eb86422ca40e5fac02b1cf94"}'></script>
<!-- End Cloudflare Web Analytics -->
<script>
  // Leave only once Cloudflare has counted this view: counting it is the whole
  // point of the page. The beacon above is deferred and reports from the window
  // load event, so an immediate redirect left before it ever ran (0 /go/ views
  // in the 28 days to 2026-10-23). Go as soon as its report has been sent, at
  // once if the beacon is blocked, and never later than 2500 ms.
  //
  // replace(), not assign(): Back from the Play listing should return to the
  // page the visitor came from, not to this one, which would bounce them
  // straight forward again and trap them.
  (function () {
    var a = document.getElementById("go-link");
    if (!a) return;
    var gone = false;
    function go() {
      if (gone) return;
      gone = true;
      window.location.replace(a.href);
    }
    var beacon = document.querySelector('script[src*="cloudflareinsights"]');
    if (beacon) beacon.addEventListener("error", go);
    try {
      new PerformanceObserver(function (list) {
        if (list.getEntries().some(function (e) { return e.name.indexOf("/cdn-cgi/rum") !== -1; })) go();
      }).observe({ type: "resource", buffered: true });
    } catch (e) {}
    window.addEventListener("load", function () { setTimeout(go, 1000); });
    setTimeout(go, 2500);
  })();
</script>
</body>
</html>
